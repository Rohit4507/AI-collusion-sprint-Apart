name: Offline analysis checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-analysis.lock
            requirements-dev.txt
      - name: Install locked analysis and developer dependencies
        run: python -m pip install -r requirements-analysis.lock -r requirements-dev.txt
      - name: Compile analysis and tests
        run: python -m compileall -q analysis tests
      - name: Check formatting
        run: python -m ruff format --check analysis tests
      - name: Lint
        run: python -m ruff check analysis tests
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
